services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Masilia\EditorialToolbox\:
        resource: '../../../lib/*'

    Masilia\Contracts\EditorialToolbox\Meta\AdminMetaBuilderInterface:
        alias: Masilia\EditorialToolbox\Meta\AdminMetaBuilder
        public: true

    Masilia\Contracts\EditorialToolbox\Block\PageBlocksServiceInterface:
        alias: Masilia\EditorialToolbox\Block\PageBlocksService

    Masilia\Contracts\EditorialToolbox\Draft\InContextDraftManagerInterface:
        alias: Masilia\EditorialToolbox\Draft\InContextDraftManager

    # The adapter's dependencies (Ibexa automated translation) are optional: without the package, or without a configured
    # provider, it simply offers none. Point the alias at NullTranslationProvider, or at your own implementation, to change that.
    Masilia\Contracts\EditorialToolbox\Translation\TranslationProviderInterface:
        alias: Masilia\EditorialToolbox\Translation\AutomatedTranslationProvider

    Masilia\Contracts\EditorialToolbox\Translation\TranslationOptionsServiceInterface:
        alias: Masilia\EditorialToolbox\Translation\TranslationOptionsService

    Masilia\Bundle\EditorialToolbox\Controller\:
        resource: '../../Controller/*'
        public: true
        tags: ['controller.service_arguments']

    Masilia\Bundle\EditorialToolbox\EventListener\:
        resource: '../../EventListener/*'

    Masilia\Bundle\EditorialToolbox\Templating\ToolboxExtension: ~
